
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DR Shop</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .app-frame {
      position: absolute;
      top: -68px;
      left: 0;
      width: 100%;
      height: calc(100% + 68px);
      border: none;
      display: block;
    }
  </style>
</head>

<body>
  <div class="app-container">
    <iframe
      class="app-frame"
      src="https://script.google.com/macros/s/AKfycbxt21UifTggzFEj-2vztLaeAIUA04e8PlrDbQ5OffxnyfR2tL6gw9blD7GUU96JQ3weoA/exec"
      title="DR Shop"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </div>
</body>
</html>
